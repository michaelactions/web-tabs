name: Build and test APK
on:
  push:
    branches: ['main', 'fix/**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare SDK
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: Unit tests and test APK
        run: gradle testDebugUnitTest assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator WebView routing/fullscreen tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            gradle connectedDebugAndroidTest --no-daemon --stacktrace
            mkdir -p screenshots
            adb pull /sdcard/Android/data/com.michaelactions.webtabs/files/smoke.png screenshots/smoke.png
      - name: Inject personal proxy credentials
        env:
          PROXY_CREDENTIALS: ${{ secrets.WEBTABS_PROXY_CREDENTIALS }}
        run: |
          python3 -c 'import os,json,pathlib; raw=os.environ["PROXY_CREDENTIALS"]; data=json.loads(raw); assert len(data)==3; pathlib.Path("app/src/main/assets/proxy-credentials.json").write_text(raw)'
      - name: Signed personal release
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/WebTabs-v1.2.1.apk
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose --print-certs dist/WebTabs-v1.2.1.apk
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" dump badging dist/WebTabs-v1.2.1.apk
      - name: Upload signed APK (not a public Release asset)
        uses: actions/upload-artifact@v4
        with:
          name: personal-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload tests and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/reports/tests
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            screenshots
          retention-days: 7
